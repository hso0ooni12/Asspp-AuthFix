name: Build AuthFix IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asspp-authfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select current Xcode
        shell: bash
        run: |
          set -euo pipefail
          best_path=""
          best_ver=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            case "$app" in *beta*|*Beta*|*_RC*) continue ;; esac
            ver=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" 2>/dev/null || true)
            [ -n "$ver" ] || continue
            if [ -z "$best_ver" ] || [ "$(printf '%s\n%s\n' "$best_ver" "$ver" | sort -V | tail -1)" = "$ver" ]; then
              best_ver="$ver"
              best_path="$app"
            fi
          done
          [ -n "$best_path" ] || { echo 'No Xcode installation found'; exit 1; }
          sudo xcode-select -s "$best_path"
          xcodebuild -version
          command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: Prepare dependency, check recovery and build IPA
        run: bash Resources/AuthFix/build.sh

      - name: Upload unsigned IPA and verification report
        uses: actions/upload-artifact@v4
        with:
          name: Asspp-AuthFix-R1
          path: |
            artifacts/Asspp-AuthFix-R1-unsigned.ipa
            artifacts/Asspp-AuthFix-R1-unsigned.ipa.sha256
            artifacts/build-info.json
          if-no-files-found: error

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AuthFix-build-log
          path: artifacts/build.log
