name: Import uploaded Velo R25 source
on:
  push:
    branches: [velo-r25-upload-build]
permissions:
  contents: write
  actions: write
jobs:
  sync-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out R25 branch
        uses: actions/checkout@v4
      - name: Restore user-uploaded R25 code and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, io, tarfile, shutil
          from pathlib import Path
          root=Path.cwd()
          raw=base64.b64decode(Path(".r25-source-overlay.base64").read_text().strip(),validate=True)
          with tarfile.open(fileobj=io.BytesIO(raw),mode="r:bz2") as archive:
              members=archive.getmembers()
              assert len(members)==13, f"Unexpected R25 source count: {len(members)}"
              for item in members:
                  path=Path(item.name)
                  if not item.isfile() or path.is_absolute() or ".." in path.parts:
                      raise RuntimeError(f"Unsafe source archive entry: {item.name}")
                  destination=root/path
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  with archive.extractfile(item) as source:
                      destination.write_bytes(source.read())
                  print("Restored",item.name)
          # Preserve the uploaded source's canonical workflow and archive old pipelines.
          archived=Path("Resources/ArchivedWorkflows")
          archived.mkdir(parents=True,exist_ok=True)
          for workflow in Path(".github/workflows").glob("*.yml"):
              if workflow.name in ("build.yml","codespace-smoke.yml","bootstrap-r25.yml"):
                  continue
              shutil.move(str(workflow),str(archived/workflow.name))
          # Exact R25 source config (5.7.1, build 2026111206).
          Path("Configuration/Version.xcconfig").write_text(
              "// Version.xcconfig\n// Single source of truth for version numbers\n"
              "// CI can modify this file to update version for all configurations\n\n"
              "MARKETING_VERSION = 5.7.1\nCURRENT_PROJECT_VERSION = 2026111206\n"
          )
          # Carry the previously tested source-only quality-gate corrections.
          quality=Path("Resources/Velo/v5_quality_gate.py")
          checks=quality.read_text()
          patches=[
              ('workflow = source(".github/workflows/velo-5-ipa.yml")',
               'workflow = source(".github/workflows/build.yml")'),
              ('"Restore and save Xcode compiled build outputs" in workflow',
               '"Restore incremental Xcode outputs" in workflow'),
              ('"self.unavailableVersionIDs.formUnion(self.versionIdentifiers)" in archived',
               '"unavailableVersionIDs.formUnion(versionIdentifiers)" in archived'),
              ('"velo-57-xcode-" in workflow',
               '"velo-xcode-" in workflow'),
          ]
          for before,after in patches:
              if before not in checks:
                  raise RuntimeError(f"Cannot apply R25 quality gate fix: {before}")
              checks=checks.replace(before,after)
          quality.write_text(checks)
          # Bootstrap transport is temporary; all actual Swift, config and build YAML
          # stay as normal repository source files in the resulting Git commit.
          Path(".r25-source-overlay.base64").unlink()
          Path(".github/workflows/bootstrap-r25.yml").unlink()
          print(f"Imported {len(members)} R25 source updates and archived legacy CI workflows.")
          PY
          python3 Resources/Velo/verify_release.py --source-only
          python3 Resources/Velo/v5_quality_gate.py
      - name: Publish Swift and assets, expose canonical build YAML
        shell: bash
        run: |
          set -euo pipefail
          echo 'R25_BUILD_WORKFLOW_START'
          base64 -w0 .github/workflows/build.yml
          echo
          echo 'R25_BUILD_WORKFLOW_END'
          # The GitHub Actions token is restricted from changing workflow files.
          # The authorized GitHub connector will publish the canonical build YAML.
          git restore --source=HEAD --staged --worktree .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish uploaded Velo R25 Swift code and resources'
          git push origin HEAD:velo-r25-upload-build
